<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>个人导航主页</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.35);
  border-radius: 99px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top left, #1f0c36 0%, #05050a 45%, #080818 100%);
  color: #f7f9ff;
  position: relative;
  overflow-x: hidden;
  padding: 24px 16px 80px;
}

/* 液态渐变光晕 */
.blob {
  position: fixed;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.55;
  z-index: -1;
  animation: floatBlob 18s infinite ease-in-out;
}

.blob-1 {
  top: -80px;
  left: -80px;
  background: linear-gradient(135deg, #ff00cc, #3333ff);
}

.blob-2 {
  bottom: -100px;
  right: -60px;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  animation-delay: 6s;
}

@keyframes floatBlob {
  0% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(40px, -30px) scale(1.08); }
  50% { transform: translate(-30px, 20px) scale(0.96); }
  75% { transform: translate(30px, 30px) scale(1.04); }
  100% { transform: translate(0, 0) scale(1); }
}

/* 主容器 */
.main-container {
  max-width: 1280px;
  margin: 0 auto;
}

/* 顶部状态栏 */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 22px;
  border-radius: 22px;
  backdrop-filter: blur(22px);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  margin-bottom: 24px;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff00cc, #3333ff, #00c6ff);
  padding: 2px;
}

.avatar-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #080818;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  color: #fff;
}

.welcome {
  font-size: 15px;
  opacity: 0.85;
}

.top-time {
  text-align: right;
}

.top-time .time {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #ff00cc, #00c6ff);
  -webkit-background-clip: text;
  color: transparent;
}

.top-time .date {
  font-size: 13px;
  opacity: 0.75;
  margin-top: 4px;
}

/* 搜索主卡片 */
.search-panel {
  padding: 26px;
  border-radius: 26px;
  backdrop-filter: blur(24px);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.14);
  margin-bottom: 28px;
}

.search-input-group {
  display: flex;
  gap: 12px;
  max-width: 760px;
  margin: 0 auto;
}

#search-input {
  flex: 1;
  height: 54px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.04);
  padding: 0 24px;
  color: #fff;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
}

#search-input:focus {
  border-color: #ff00cc;
  box-shadow: 0 0 0 2px rgba(255, 0, 204, 0.08), 0 0 22px rgba(255, 0, 204, 0.35);
}

#search-input::placeholder {
  color: rgba(255, 255, 255, 0.45);
}

.search-btn {
  height: 54px;
  padding: 0 28px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(90deg, #ff00cc, #3333ff);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  transition: 0.25s;
}

.search-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(51, 51, 255, 0.45);
}

.search-engine-tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 18px;
}

.engine-tab {
  padding: 8px 16px;
  border-radius: 99px;
  font-size: 14px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: rgba(255, 255, 255, 0.75);
  cursor: pointer;
  transition: 0.2s;
}

.engine-tab.active {
  background: rgba(255, 0, 204, 0.18);
  border-color: #ff00cc;
  color: #fff;
}

.engine-tab:hover:not(.active) {
  border-color: rgba(255, 255, 255, 0.35);
  color: #fff;
}

/* 导航网格 */
.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
  gap: 22px;
}

.nav-card {
  padding: 22px;
  border-radius: 24px;
  backdrop-filter: blur(22px);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  transition: 0.35s ease;
}

.nav-card:hover {
  transform: translateY(-8px);
  border-color: rgba(255, 0, 204, 0.35);
  box-shadow: 0 12px 38px rgba(0, 0, 0, 0.45), 0 0 25px rgba(255, 0, 204, 0.12);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

.card-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff00cc, #3333ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #fff;
}

.card-title {
  font-size: 18px;
  font-weight: 700;
}

.link-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.link-item a {
  display: block;
  padding: 13px 8px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.04);
  color: rgba(255, 255, 255, 0.82);
  text-decoration: none;
  font-size: 14px;
  text-align: center;
  transition: 0.2s;
}

.link-item a:hover {
  background: rgba(255, 0, 204, 0.15);
  color: #ff99dd;
}

/* 底部 Dock */
.dock {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 18px;
  border-radius: 22px;
  backdrop-filter: blur(22px);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  display: flex;
  gap: 14px;
  z-index: 99;
}

.dock-item {
  width: 46px;
  height: 46px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: rgba(255, 255, 255, 0.75);
  text-decoration: none;
  transition: 0.25s;
}

.dock-item:hover {
  transform: translateY(-6px);
  background: linear-gradient(135deg, #ff00cc, #3333ff);
  color: #fff;
}

/* 移动端适配 */
@media screen and (max-width: 992px) {
  .nav-grid {
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
}

@media screen and (max-width: 600px) {
  body {
    padding-bottom: 76px;
  }

  .top-bar {
    flex-direction: column;
    gap: 12px;
    text-align: center;
  }

  .top-time {
    text-align: center;
  }

  .search-input-group {
    flex-direction: column;
  }

  .nav-grid {
    grid-template-columns: 1fr;
  }

  .link-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .dock {
    padding: 10px 14px;
    gap: 10px;
  }

  .dock-item {
    width: 40px;
    height: 40px;
    font-size: 18px;
  }
}
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="main-container">

  <!-- 顶部状态栏 -->
  <div class="top-bar">
    <div class="top-left">
      <div class="avatar">
        <div class="avatar-inner">M</div>
      </div>
      <div class="welcome" id="greet">欢迎回来</div>
    </div>
    <div class="top-time">
      <div class="time" id="time">00:00</div>
      <div class="date" id="date">2025年1月1日 星期三</div>
    </div>
  </div>

  <!-- 搜索面板 -->
  <div class="search-panel">
    <div class="search-input-group">
      <input type="text" id="search-input" placeholder="输入关键词搜索">
      <button class="search-btn" onclick="startSearch()">搜索</button>
    </div>
    <div class="search-engine-tabs">
      <span class="engine-tab active" data-engine="baidu">百度</span>
      <span class="engine-tab" data-engine="bing">必应</span>
      <span class="engine-tab" data-engine="google">谷歌</span>
      <span class="engine-tab" data-engine="sogou">搜狗</span>
    </div>
  </div>

  <!-- 导航卡片 -->
  <div class="nav-grid">

    <div class="nav-card">
      <div class="card-header">
        <div class="card-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="card-title">综合搜索</div>
      </div>
      <div class="link-grid">
        <div class="link-item"><a href="https://www.baidu.com" target="_blank">百度</a></div>
        <div class="link-item"><a href="https://bing.com" target="_blank">必应</a></div>
        <div class="link-item"><a href="https://www.google.com" target="_blank">谷歌</a></div>
        <div class="link-item"><a href="https://sogou.com" target="_blank">搜狗</a></div>
        <div class="link-item"><a href="https://360.com" target="_blank">360搜索</a></div>
        <div class="link-item"><a href="https://duckduckgo.com" target="_blank">DDG</a></div>
      </div>
    </div>

    <div class="nav-card">
      <div class="card-header">
        <div class="card-icon"><i class="fa-solid fa-code"></i></div>
        <div class="card-title">开发编程</div>
      </div>
      <div class="link-grid">
        <div class="link-item"><a href="https://github.com" target="_blank">GitHub</a></div>
        <div class="link-item"><a href="https://gitee.com" target="_blank">Gitee</a></div>
        <div class="link-item"><a href="https://www.runoob.com" target="_blank">菜鸟教程</a></div>
        <div class="link-item"><a href="https://vuejs.org" target="_blank">Vue官网</a></div>
        <div class="link-item"><a href="https://reactjs.org" target="_blank">React</a></div>
        <div class="link-item"><a href="https://tool.chinaz.com" target="_blank">站长工具</a></div>
      </div>
    </div>

    <div class="nav-card">
      <div class="card-header">
        <div class="card-icon"><i class="fa-solid fa-play"></i></div>
        <div class="card-title">影音娱乐</div>
      </div>
      <div class="link-grid">
        <div class="link-item"><a href="https://bilibili.com" target="_blank">B站</a></div>
        <div class="link-item"><a href="https://v.qq.com" target="_blank">腾讯视频</a></div>
        <div class="link-item"><a href="https://iqiyi.com" target="_blank">爱奇艺</a></div>
        <div class="link-item"><a href="https://youku.com" target="_blank">优酷</a></div>
        <div class="link-item"><a href="https://music.163.com" target="_blank">网易云</a></div>
        <div class="link-item"><a href="https://douyin.com" target="_blank">抖音网页</a></div>
      </div>
    </div>

    <div class="nav-card">
      <div class="card-header">
        <div class="card-icon"><i class="fa-solid fa-book"></i></div>
        <div class="card-title">学习办公</div>
      </div>
      <div class="link-grid">
        <div class="link-item"><a href="https://zhihu.com" target="_blank">知乎</a></div>
        <div class="link-item"><a href="https://doc.wps.cn" target="_blank">WPS在线</a></div>
        <div class="link-item"><a href="https://feishu.cn" target="_blank">飞书</a></div>
        <div class="link-item"><a href="https://translate.baidu.com" target="_blank">翻译</a></div>
        <div class="link-item"><a href="https://cnki.net" target="_blank">知网</a></div>
        <div class="link-item"><a href="https://notion.so" target="_blank">Notion</a></div>
      </div>
    </div>

    <div class="nav-card">
      <div class="card-header">
        <div class="card-icon"><i class="fa-solid fa-bag-shopping"></i></div>
        <div class="card-title">购物出行</div>
      </div>
      <div class="link-grid">
        <div class="link-item"><a href="https://taobao.com" target="_blank">淘宝</a></div>
        <div class="link-item"><a href="https://jd.com" target="_blank">京东</a></div>
        <div class="link-item"><a href="https://pinduoduo.com" target="_blank">拼多多</a></div>
        <div class="link-item"><a href="https://12306.cn" target="_blank">12306</a></div>
        <div class="link-item"><a href="https://meituan.com" target="_blank">美团</a></div>
        <div class="link-item"><a href="https://ctrip.com" target="_blank">携程</a></div>
      </div>
    </div>

    <div class="nav-card">
      <div class="card-header">
        <div class="card-icon"><i class="fa-solid fa-cloud"></i></div>
        <div class="card-title">云盘资源</div>
      </div>
      <div class="link-grid">
        <div class="link-item"><a href="https://pan.baidu.com" target="_blank">百度网盘</a></div>
        <div class="link-item"><a href="https://aliyundrive.com" target="_blank">阿里云盘</a></div>
        <div class="link-item"><a href="https://123pan.com" target="_blank">123云盘</a></div>
        <div class="link-item"><a href="https://weiyun.com" target="_blank">腾讯微云</a></div>
        <div class="link-item"><a href="https://icloud.com" target="_blank">iCloud</a></div>
        <div class="link-item"><a href="https://drive.google.com" target="_blank">谷歌云盘</a></div>
      </div>
    </div>

  </div>

</div>

<!-- 底部 Dock 快捷导航 -->
<div class="dock">
  <a href="https://www.baidu.com" target="_blank" class="dock-item"><i class="fa-solid fa-house"></i></a>
  <a href="https://github.com" target="_blank" class="dock-item"><i class="fa-brands fa-github"></i></a>
  <a href="https://bilibili.com" target="_blank" class="dock-item"><i class="fa-solid fa-film"></i></a>
  <a href="https://music.163.com" target="_blank" class="dock-item"><i class="fa-solid fa-music"></i></a>
  <a href="https://feishu.cn" target="_blank" class="dock-item"><i class="fa-solid fa-briefcase"></i></a>
</div>

<script>
// 问候语
function updateGreet() {
  const h = new Date().getHours();
  let text = "欢迎回来";
  if (h >= 0 && h < 6) text = "夜深了，注意休息";
  else if (h >= 6 && h < 12) text = "早上好，开始新的一天";
  else if (h >= 12 && h < 18) text = "下午好，放松一下吧";
  else text = "晚上好，欢迎回来";
  document.getElementById("greet").innerText = text;
}

// 时间日期
function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, "0");
  const m = String(now.getMinutes()).padStart(2, "0");
  document.getElementById("time").innerText = `${h}:${m}`;

  const week = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][now.getDay()];
  document.getElementById("date").innerText = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${week}`;
}

updateGreet();
updateTime();
setInterval(updateTime, 1000);

// 搜索引擎切换
let engineType = "baidu";
const engineMap = {
  baidu: "https://www.baidu.com/s?wd=",
  bing: "https://cn.bing.com/search?q=",
  google: "https://www.google.com/search?q=",
  sogou: "https://sogou.com/web?query="
};

document.querySelectorAll(".engine-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".engine-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    engineType = tab.dataset.engine;
  });
});

// 搜索功能
function startSearch() {
  const val = document.getElementById("search-input").value.trim();
  if (!val) return;
  window.open(engineMap[engineType] + encodeURIComponent(val));
}

document.getElementById("search-input").addEventListener("keydown", e => {
  if (e.key === "Enter") startSearch();
});
</script>

</body>
</html>
