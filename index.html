<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的专属导航主页</title>
<!-- 图标库 -->
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* 全局重置 */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
}
/* 自定义滚动条 */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-thumb {
  background: rgba(80, 160, 255, 0.35);
  border-radius: 99px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
body {
  min-height: 100vh;
  overflow-x: hidden;
  background: #060918;
  color: #f0f4ff;
  position: relative;
}
/* 粒子背景画布 */
#starCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -10;
  opacity: 0.7;
}
/* 主容器居中 */
.main-wrap {
  max-width: 1480px;
  margin: 0 auto;
  padding: 28px 16px;
}
/* 头部流光模块 */
.header-box {
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(90, 170, 255, 0.16);
  border-radius: 26px;
  padding: 40px 24px;
  margin-bottom: 36px;
  position: relative;
  overflow: hidden;
}
/* 流光旋转动画 */
.header-box::before {
  content: "";
  position: absolute;
  top: -120%;
  left: -120%;
  width: 240%;
  height: 240%;
  background: conic-gradient(from 0deg, transparent, #3b82f6, #22d3ee, transparent 30%);
  animation: rotateFlow 12s linear infinite;
  z-index: -1;
}
.header-box::after {
  content: "";
  position: absolute;
  inset: 3px;
  background: #060918;
  border-radius: 24px;
  z-index: -1;
}
@keyframes rotateFlow {
  100% { transform: rotate(360deg); }
}
.head-inner {
  position: relative;
  z-index: 2;
  text-align: center;
}
.time-display {
  font-size: clamp(3rem, 11vw, 5.2rem);
  font-weight: 800;
  letter-spacing: 5px;
  background: linear-gradient(90deg, #3b82f6, #22d3ee, #3b82f6);
  background-size: 200% auto;
  -webkit-background-clip: text;
  color: transparent;
  animation: textShine 4s linear infinite;
  margin-bottom: 10px;
}
@keyframes textShine {
  100% { background-position: 200% center; }
}
.date-info {
  font-size: clamp(1rem, 3vw, 1.3rem);
  opacity: 0.82;
  margin-bottom: 32px;
}
/* 搜索区域 */
.search-area {
  max-width: 760px;
  margin: 0 auto;
}
.search-select {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 14px;
}
.search-tag {
  padding: 6px 16px;
  border-radius: 30px;
  border: 1px solid rgba(90,170,255,0.2);
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  transition: 0.25s all;
  font-size: 14px;
}
.search-tag.active {
  background: #3b82f6;
  border-color: #3b82f6;
  color: #000;
}
.search-tag:hover:not(.active) {
  border-color: rgba(90,170,255,0.5);
  background: rgba(90,170,255,0.1);
}
.search-input-wrap {
  display: flex;
  gap: 12px;
}
#searchInput {
  flex: 1;
  height: 52px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  padding: 0 22px;
  font-size: 16px;
  color: #fff;
  outline: none;
  transition: 0.3s all;
}
#searchInput:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 18px rgba(59, 130, 246, 0.3);
}
#searchInput::placeholder {
  color: rgba(255,255,255,0.5);
}
.search-submit {
  height: 52px;
  padding: 0 28px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(90deg,#3b82f6,#22d3ee);
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s all;
}
.search-submit:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
}
/* 导航卡片容器 */
.nav-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 26px;
}
/* 分类卡片 */
.nav-card {
  backdrop-filter: blur(14px);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 24px;
  transition: 0.35s ease all;
  opacity: 0;
  transform: translateY(20px);
}
.nav-card.show {
  opacity: 1;
  transform: translateY(0);
}
.nav-card:hover {
  transform: translateY(-8px);
  border-color: rgba(59, 130, 246, 0.4);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 25px rgba(59,130,246,0.12);
}
.card-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  font-weight: 600;
  margin-bottom: 20px;
}
.card-title i {
  color: #3b82f6;
  font-size: 20px;
}
.link-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.link-item a {
  display: block;
  padding: 13px 8px;
  text-align: center;
  border-radius: 14px;
  background: rgba(255,255,255,0.04);
  color: #e2e8f0;
  text-decoration: none;
  font-size: 14px;
  transition: 0.25s all;
}
.link-item a:hover {
  background: rgba(59, 130, 246, 0.18);
  color: #3b82f6;
}
/* 平板适配 */
@media screen and (max-width: 992px) {
  .nav-container {
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
}
/* 手机端适配 */
@media screen and (max-width: 600px) {
  .main-wrap {
    padding: 16px 10px;
  }
  .header-box {
    padding: 28px 14px;
  }
  .search-input-wrap {
    flex-direction: column;
  }
  .nav-container {
    grid-template-columns: 1fr;
  }
  .link-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>
<body>
<!-- 粒子星空背景 -->
<canvas id="starCanvas"></canvas>
<div class="main-wrap">
  <!-- 头部时间搜索区 -->
  <div class="header-box">
    <div class="head-inner">
      <div class="time-display" id="timeBox"></div>
      <div class="date-info" id="dateBox"></div>
      <div class="search-area">
        <div class="search-select">
          <div class="search-tag active" data-engine="baidu">百度</div>
          <div class="search-tag" data-engine="bing">必应</div>
          <div class="search-tag" data-engine="google">谷歌</div>
        </div>
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="输入关键词搜索，回车快速查询">
          <button class="search-submit" onclick="startSearch()">搜索</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 导航分类卡片 -->
  <div class="nav-container">
    <!-- 开发工具 -->
    <div class="nav-card">
      <h3 class="card-title"><i class="fa-solid fa-code"></i>开发工具</h3>
      <div class="link-grid">
        <div class="link-item"><a href="https://github.com" target="_blank">GitHub</a></div>
        <div class="link-item"><a href="https://gitee.com" target="_blank">Gitee</a></div>
        <div class="link-item"><a href="https://www.runoob.com" target="_blank">菜鸟教程</a></div>
        <div class="link-item"><a href="https://tool.chinaz.com" target="_blank">站长工具</a></div>
        <div class="link-item"><a href="https://caniuse.com" target="_blank">兼容性查询</a></div>
        <div class="link-item"><a href="https://jsrun.net" target="_blank">在线代码</a></div>
      </div>
    </div>
    <!-- 影音娱乐 -->
    <div class="nav-card">
      <h3 class="card-title"><i class="fa-solid fa-film"></i>影音娱乐</h3>
      <div class="link-grid">
        <div class="link-item"><a href="https://www.bilibili.com" target="_blank">哔哩哔哩</a></div>
        <div class="link-item"><a href="https://v.qq.com" target="_blank">腾讯视频</a></div>
        <div class="link-item"><a href="https://music.163.com" target="_blank">网易云音乐</a></div>
        <div class="link-item"><a href="https://douyin.com" target="_blank">抖音网页版</a></div>
        <div class="link-item"><a href="https://youku.com" target="_blank">优酷</a></div>
        <div class="link-item"><a href="https://www.iqiyi.com" target="_blank">爱奇艺</a></div>
      </div>
    </div>
    <!-- 学习办公 -->
    <div class="nav-card">
      <h3 class="card-title"><i class="fa-solid fa-book-open"></i>学习办公</h3>
      <div class="link-grid">
        <div class="link-item"><a href="https://www.zhihu.com" target="_blank">知乎</a></div>
        <div class="link-item"><a href="https://doc.wps.cn" target="_blank">WPS在线</a></div>
        <div class="link-item"><a href="https://www.feishu.cn" target="_blank">飞书文档</a></div>
        <div class="link-item"><a href="https://translate.baidu.com" target="_blank">百度翻译</a></div>
        <div class="link-item"><a href="https://www.cnki.net" target="_blank">知网</a></div>
        <div class="link-item"><a href="https://www.notion.so" target="_blank">Notion</a></div>
      </div>
    </div>
    <!-- 生活购物 -->
    <div class="nav-card">
      <h3 class="card-title"><i class="fa-solid fa-cart-shopping"></i>生活购物</h3>
      <div class="link-grid">
        <div class="link-item"><a href="https://www.taobao.com" target="_blank">淘宝</a></div>
        <div class="link-item"><a href="https://www.jd.com" target="_blank">京东</a></div>
        <div class="link-item"><a href="https://www.pinduoduo.com" target="_blank">拼多多</a></div>
        <div class="link-item"><a href="https://12306.cn" target="_blank">12306</a></div>
        <div class="link-item"><a href="https://meituan.com" target="_blank">美团</a></div>
        <div class="link-item"><a href="https://dianping.com" target="_blank">大众点评</a></div>
      </div>
    </div>
    <!-- 综合搜索 -->
    <div class="nav-card">
      <h3 class="card-title"><i class="fa-solid fa-magnifying-glass"></i>综合搜索</h3>
      <div class="link-grid">
        <div class="link-item"><a href="https://www.baidu.com" target="_blank">百度</a></div>
        <div class="link-item"><a href="https://www.bing.com" target="_blank">必应</a></div>
        <div class="link-item"><a href="https://yandex.com" target="_blank">Yandex</a></div>
        <div class="link-item"><a href="https://sogou.com" target="_blank">搜狗</a></div>
        <div class="link-item"><a href="https://so.com" target="_blank">360搜索</a></div>
        <div class="link-item"><a href="https://duckduckgo.com" target="_blank">DuckDuckGo</a></div>
      </div>
    </div>
    <!-- 云盘资源 -->
    <div class="nav-card">
      <h3 class="card-title"><i class="fa-solid fa-cloud"></i>云盘资源</h3>
      <div class="link-grid">
        <div class="link-item"><a href="https://pan.baidu.com" target="_blank">百度网盘</a></div>
        <div class="link-item"><a href="https://aliyundrive.com" target="_blank">阿里云盘</a></div>
        <div class="link-item"><a href="https://www.123pan.com" target="_blank">123云盘</a></div>
        <div class="link-item"><a href="https://drive.google.com" target="_blank">Google云盘</a></div>
        <div class="link-item"><a href="https://www.icloud.com" target="_blank">iCloud</a></div>
        <div class="link-item"><a href="https://weiyun.com" target="_blank">腾讯微云</a></div>
      </div>
    </div>
  </div>
</div>

<script>
// ========== 1. 星空粒子背景 ==========
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  createStars();
}
function createStars() {
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 12000);
  for(let i=0;i<count;i++){
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2,
      speedX: (Math.random() - 0.5) * 0.2,
      speedY: (Math.random() - 0.5) * 0.2,
      opacity: Math.random()
    })
  }
}
function drawStar() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(180,220,255,${s.opacity})`;
    ctx.fill();
    s.x += s.speedX;
    s.y += s.speedY;
    if(s.x<0) s.x=canvas.width;
    if(s.x>canvas.width) s.x=0;
    if(s.y<0) s.y=canvas.height;
    if(s.y>canvas.height) s.y=0;
  })
  requestAnimationFrame(drawStar);
}
resizeCanvas();
drawStar();
window.addEventListener('resize', resizeCanvas);

// ========== 2. 实时时钟+农历日期 ==========
function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('timeBox').innerText = `${h}:${m}:${s}`;
  const weekArr = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const year = now.getFullYear();
  const month = now.getMonth()+1;
  const day = now.getDate();
  const week = weekArr[now.getDay()];
  document.getElementById('dateBox').innerText = `${year}年${month}月${day}日 ${week}`;
}
updateTime();
setInterval(updateTime,1000);

// ========== 3. 搜索引擎切换 ==========
let engineType = 'baidu';
const engineMap = {
  baidu: "https://www.baidu.com/s?wd=",
  bing: "https://cn.bing.com/search?q=",
  google: "https://www.google.com/search?q="
}
const tags = document.querySelectorAll('.search-tag');
tags.forEach(tag=>{
  tag.addEventListener('click',()=>{
    tags.forEach(t=>t.classList.remove('active'));
    tag.classList.add('active');
    engineType = tag.dataset.engine;
  })
})
function startSearch() {
  const val = document.getElementById('searchInput').value.trim();
  if(!val) return;
  window.open(engineMap[engineType] + encodeURIComponent(val));
}
document.getElementById('searchInput').addEventListener('keydown',e=>{
  if(e.key === 'Enter') startSearch();
})

// ========== 4. 卡片滚动渐显动画 ==========
const cards = document.querySelectorAll('.nav-card');
function showCard() {
  cards.forEach(card=>{
    const rect = card.getBoundingClientRect();
    if(rect.top < window.innerHeight - 60) {
      card.classList.add('show');
    }
  })
}
window.addEventListener('scroll', showCard);
window.addEventListener('load', showCard);
</script>
</body>
</html>
