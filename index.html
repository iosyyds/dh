<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Harbor · 个人导航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/font/lucide.css">
<style>
  :root {
    --bg: #f4efe6;
    --bg-2: #ece5d8;
    --fg: #1f1a14;
    --fg-muted: #6b6258;
    --fg-dim: #a89e90;
    --card: rgba(255, 252, 245, 0.6);
    --card-solid: #fdfaf3;
    --border: rgba(31, 26, 20, 0.08);
    --border-strong: rgba(31, 26, 20, 0.14);
    --accent: #c2410c;   /* 赭石 */
    --accent-2: #15803d; /* 翡翠 */
    --accent-3: #b91c1c; /* 朱砂 */
    --dock-bg: rgba(253, 250, 243, 0.55);
    --dock-border: rgba(255, 255, 255, 0.6);
    --shadow: 0 30px 80px -30px rgba(80, 50, 20, 0.18);
  }

  [data-theme="dark"] {
    --bg: #0e0d0b;
    --bg-2: #181612;
    --fg: #f5efe2;
    --fg-muted: #a89e90;
    --fg-dim: #5a5247;
    --card: rgba(255, 250, 240, 0.04);
    --card-solid: #1c1a16;
    --border: rgba(255, 245, 225, 0.08);
    --border-strong: rgba(255, 245, 225, 0.16);
    --accent: #f97316;
    --accent-2: #34d399;
    --accent-3: #f87171;
    --dock-bg: rgba(28, 26, 22, 0.55);
    --dock-border: rgba(255, 245, 225, 0.08);
    --shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    padding-bottom: 160px; /* 给 Dock 留位 */
  }

  /* 背景光斑 */
  .bg-blobs {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.5;
  }
  .blob-1 {
    width: 50vw; height: 50vw;
    background: var(--accent);
    top: -15vw; right: -10vw;
    animation: drift 25s ease-in-out infinite;
  }
  .blob-2 {
    width: 40vw; height: 40vw;
    background: var(--accent-2);
    bottom: 10vh; left: -10vw;
    animation: drift 30s ease-in-out infinite reverse;
    opacity: 0.35;
  }
  [data-theme="dark"] .blob { opacity: 0.25; }
  [data-theme="dark"] .blob-2 { opacity: 0.2; }

  @keyframes drift {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-4vw, 4vw) scale(1.1); }
  }

  /* 纸张纹理 */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .wrap {
    position: relative; z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px clamp(20px, 4vw, 48px);
  }

  /* 顶栏 */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 64px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 9px;
    background: var(--fg);
    color: var(--bg);
    display: grid; place-items: center;
    font-family: 'Fraunces';
    font-weight: 900;
    font-size: 16px;
    font-style: italic;
  }
  .tools { display: flex; gap: 8px; align-items: center; }
  .clock {
    font-size: 13px;
    color: var(--fg-muted);
    font-variant-numeric: tabular-nums;
    padding: 8px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 100px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .clock b { color: var(--fg); font-weight: 700; }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    cursor: pointer;
    display: grid; place-items: center;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.2s;
    font-size: 15px;
  }
  .icon-btn:hover { background: var(--fg); color: var(--bg); transform: rotate(-15deg); }

  /* Hero */
  .hero { text-align: center; margin-bottom: 56px; }
  .greet {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(44px, 9vw, 88px);
    line-height: 1;
    letter-spacing: -0.04em;
    margin-bottom: 8px;
  }
  .greet b {
    font-style: normal;
    font-weight: 900;
    background: linear-gradient(120deg, var(--accent) 0%, var(--accent-3) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .greet-sub {
    color: var(--fg-muted);
    font-size: 15px;
    margin-bottom: 36px;
    letter-spacing: 0.02em;
  }

  /* 搜索 */
  .search {
    max-width: 560px;
    margin: 0 auto;
    position: relative;
  }
  .search-input {
    width: 100%;
    padding: 18px 22px 18px 52px;
    background: var(--card-solid);
    border: 1px solid var(--border-strong);
    border-radius: 100px;
    color: var(--fg);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    box-shadow: var(--shadow);
    transition: all 0.3s;
  }
  .search-input::placeholder { color: var(--fg-dim); }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent), var(--shadow);
  }
  .search-icon {
    position: absolute;
    left: 22px; top: 50%;
    transform: translateY(-50%);
    color: var(--fg-dim);
    font-size: 17px;
    pointer-events: none;
  }
  .search-engines {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 4px;
    background: var(--bg-2);
    padding: 4px;
    border-radius: 100px;
  }
  .search-engines button {
    background: none;
    border: none;
    color: var(--fg-muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .search-engines button.active {
    background: var(--fg);
    color: var(--bg);
  }
  .search-engines button:not(.active):hover { color: var(--fg); }
  @media (max-width: 540px) {
    .search-engines button { padding: 6px 8px; font-size: 11px; }
  }

  /* 卡片区 */
  .sections {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 22px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.3s;
  }
  .section:hover {
    border-color: var(--border-strong);
    transform: translateY(-3px);
  }
  .sec-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--border);
  }
  .sec-num {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 18px;
    color: var(--accent);
  }
  .sec-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.01em;
  }
  .sec-links { display: flex; flex-direction: column; gap: 2px; }
  .sec-link {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 8px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--fg);
    transition: all 0.18s;
  }
  .sec-link:hover {
    background: var(--bg-2);
    transform: translateX(4px);
  }
  .sec-link:hover .sl-name { color: var(--accent); }
  .sl-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--fg-dim);
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .sec-link:hover .sl-dot {
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    transform: scale(1.4);
  }
  .sl-name {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    transition: color 0.2s;
  }
  .sl-arrow {
    color: var(--fg-dim);
    font-size: 13px;
    opacity: 0;
    transform: translateX(-4px);
    transition: all 0.2s;
  }
  .sec-link:hover .sl-arrow { opacity: 1; transform: translateX(0); }

  /* ============ Dock ============ */
  .dock-area {
    position: fixed;
    bottom: 18px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    z-index: 50;
    pointer-events: none;
  }
  .dock {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 10px 12px;
    background: var(--dock-bg);
    border: 1px solid var(--dock-border);
    border-radius: 24px;
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    box-shadow: 0 20px 60px -10px rgba(60, 40, 20, 0.25), inset 0 1px 0 rgba(255,255,255,0.4);
    pointer-events: auto;
    transition: transform 0.3s;
  }
  [data-theme="dark"] .dock {
    box-shadow: 0 20px 60px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,245,225,0.06);
  }

  .dock-item {
    position: relative;
    width: 50px; height: 50px;
    border-radius: 14px;
    display: grid; place-items: center;
    text-decoration: none;
    color: #fff;
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 22px;
    transform-origin: bottom center;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
  }
  .dock-item::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.15);
    pointer-events: none;
  }
  .dock-tip {
    position: absolute;
    bottom: calc(100% + 14px);
    left: 50%;
    transform: translateX(-50%) translateY(6px);
    background: var(--fg);
    color: var(--bg);
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s;
  }
  .dock-tip::after {
    content: '';
    position: absolute;
    top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top-color: var(--fg);
  }
  .dock-item:hover .dock-tip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .dock-sep {
    width: 1px;
    height: 36px;
    background: var(--border-strong);
    margin: 0 4px;
    align-self: center;
  }

  /* 移动端 Dock 简化 */
  @media (max-width: 640px) {
    .dock {
      gap: 4px;
      padding: 8px 10px;
      border-radius: 20px;
      max-width: calc(100vw - 24px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .dock::-webkit-scrollbar { display: none; }
    .dock-item { width: 44px; height: 44px; font-size: 18px; border-radius: 12px; flex-shrink: 0; }
    .dock-sep { height: 30px; }
    body { padding-bottom: 100px; }
  }

  /* 入场动画 */
  .fade-in {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  .fade-in.d1 { animation-delay: 0.05s; }
  .fade-in.d2 { animation-delay: 0.15s; }
  .fade-in.d3 { animation-delay: 0.25s; }
  .fade-in.d4 { animation-delay: 0.35s; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 110px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--fg);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div class="wrap">
  <header class="fade-in d1">
    <div class="brand">
      <div class="brand-mark">H</div>
      Harbor
    </div>
    <div class="tools">
      <div class="clock" id="clock"><b>--:--</b> · --</div>
      <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题">
        <i class="lucide lucide-moon"></i>
      </button>
    </div>
  </header>

  <section class="hero">
    <h1 class="greet fade-in d1"><span id="greetWord">早安</span>, <b>maker</b></h1>
    <p class="greet-sub fade-in d2" id="greetSub">新的一天，从一杯咖啡开始</p>

    <div class="search fade-in d3">
      <i class="lucide lucide-search search-icon"></i>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索或输入网址，回车跳转…" autocomplete="off">
      <div class="search-engines" id="engines">
        <button data-i="0" class="active">G</button>
        <button data-i="1">B</button>
        <button data-i="2">百</button>
      </div>
    </div>
  </section>

  <section class="sections" id="sections"></section>
</div>

<!-- Dock -->
<div class="dock-area">
  <nav class="dock fade-in d4" id="dock" aria-label="快速访问"></nav>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ============ 数据 ============ */
  const SECTIONS = [
    {
      num: '01', title: '常用',
      links: [
        { name: 'Google',     url: 'https://google.com' },
        { name: 'GitHub',     url: 'https://github.com' },
        { name: 'YouTube',    url: 'https://youtube.com' },
        { name: 'Gmail',      url: 'https://mail.google.com' },
        { name: 'Notion',     url: 'https://notion.so' },
      ]
    },
    {
      num: '02', title: '工具',
      links: [
        { name: 'ChatGPT',    url: 'https://chat.openai.com' },
        { name: 'Claude',     url: 'https://claude.ai' },
        { name: 'Figma',      url: 'https://figma.com' },
        { name: 'Vercel',     url: 'https://vercel.com' },
        { name: 'CodePen',    url: 'https://codepen.io' },
      ]
    },
    {
      num: '03', title: '日常',
      links: [
        { name: 'Bilibili',   url: 'https://bilibili.com' },
        { name: '知乎',       url: 'https://zhihu.com' },
        { name: '微博',       url: 'https://weibo.com' },
        { name: '淘宝',       url: 'https://taobao.com' },
        { name: '高德地图',   url: 'https://amap.com' },
      ]
    }
  ];

  // Dock 项：每个站点配独特渐变 + 首字母
  const DOCK_ITEMS = [
    { name: 'Google',    url: 'https://google.com',    bg: 'linear-gradient(135deg, #4285f4, #34a853 70%)',           label: 'G' },
    { name: 'GitHub',    url: 'https://github.com',    bg: 'linear-gradient(135deg, #1f2937, #4b5563)',               label: 'G' },
    { name: 'YouTube',   url: 'https://youtube.com',   bg: 'linear-gradient(135deg, #ff0000, #cc0066)',               label: 'Y' },
    { name: 'Bilibili',  url: 'https://bilibili.com',  bg: 'linear-gradient(135deg, #00a1d6, #fb7299)',               label: 'B' },
    { sep: true },
    { name: 'ChatGPT',   url: 'https://chat.openai.com', bg: 'linear-gradient(135deg, #10a37f, #1a7f64)',             label: 'C' },
    { name: 'Claude',    url: 'https://claude.ai',     bg: 'linear-gradient(135deg, #d97757, #c2410c)',               label: 'A' },
    { name: 'Notion',    url: 'https://notion.so',     bg: 'linear-gradient(135deg, #1a1a1a, #4a4a4a)',               label: 'N' },
    { sep: true },
    { name: '知乎',      url: 'https://zhihu.com',     bg: 'linear-gradient(135deg, #0084ff, #005ecf)',               label: '知' },
    { name: '淘宝',      url: 'https://taobao.com',    bg: 'linear-gradient(135deg, #ff6700, #ff4400)',               label: '淘' },
    { name: 'Gmail',     url: 'https://mail.google.com', bg: 'linear-gradient(135deg, #ea4335, #fbbc04 60%, #34a853)', label: '@' },
  ];

  const ENGINES = [
    { name: 'Google', url: 'https://www.google.com/search?q=' },
    { name: 'Bing',   url: 'https://www.bing.com/search?q=' },
    { name: '百度',   url: 'https://www.baidu.com/s?wd=' },
  ];

  /* ============ 渲染分区 ============ */
  const secWrap = document.getElementById('sections');
  SECTIONS.forEach((s, i) => {
    const el = document.createElement('article');
    el.className = 'section fade-in d' + (i + 2);
    el.innerHTML = `
      <div class="sec-head">
        <span class="sec-num">${s.num}</span>
        <span class="sec-title">${s.title}</span>
      </div>
      <div class="sec-links">
        ${s.links.map(l => `
          <a class="sec-link" href="${l.url}" target="_blank" rel="noopener">
            <span class="sl-dot"></span>
            <span class="sl-name">${l.name}</span>
            <i class="lucide lucide-arrow-up-right sl-arrow"></i>
          </a>
        `).join('')}
      </div>
    `;
    secWrap.appendChild(el);
  });

  /* ============ 渲染 Dock ============ */
  const dock = document.getElementById('dock');
  const dockItems = [];
  DOCK_ITEMS.forEach(item => {
    if (item.sep) {
      const sep = document.createElement('div');
      sep.className = 'dock-sep';
      dock.appendChild(sep);
      return;
    }
    const a = document.createElement('a');
    a.className = 'dock-item';
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.background = item.bg;
    a.dataset.label = item.label;
    a.innerHTML = `${item.label}<span class="dock-tip">${item.name}</span>`;
    dock.appendChild(a);
    dockItems.push(a);
  });

  /* macOS 风格放大效果 */
  let isMobile = window.matchMedia('(max-width: 640px)').matches;
  function applyMagnify(mouseX) {
    if (isMobile) return;
    dockItems.forEach(item => {
      const rect = item.getBoundingClientRect();
      const center = rect.left + rect.width / 2;
      const dist = Math.abs(mouseX - center);
      const maxDist = 140;
      if (dist > maxDist) {
        item.style.transform = 'scale(1)';
        return;
      }
      const t = 1 - dist / maxDist;
      // 平滑曲线
      const scale = 1 + Math.pow(t, 1.5) * 0.7;
      item.style.transform = `scale(${scale}) translateY(-${Math.pow(t, 2) * 8}px)`;
    });
  }
  dock.addEventListener('mousemove', e => applyMagnify(e.clientX));
  dock.addEventListener('mouseleave', () => {
    dockItems.forEach(i => i.style.transform = 'scale(1)');
  });
  window.addEventListener('resize', () => {
    isMobile = window.matchMedia('(max-width: 640px)').matches;
  });

  /* ============ 时钟 & 问候 ============ */
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const days = ['日', '一', '二', '三', '四', '五', '六'];
    document.getElementById('clock').innerHTML = `<b>${h}:${m}</b> · 周${days[now.getDay()]}`;

    const hr = now.getHours();
    let g, sub;
    if (hr >= 5 && hr < 11)      { g = '早安'; sub = '新的一天，从一杯咖啡开始'; }
    else if (hr >= 11 && hr < 14){ g = '午安'; sub = '吃点好的，给大脑充个电'; }
    else if (hr >= 14 && hr < 18){ g = '下午好'; sub = '阳光正好，专注当下'; }
    else if (hr >= 18 && hr < 23){ g = '晚上好'; sub = '收尾一天，慢慢来'; }
    else                          { g = '夜深了'; sub = '该休息啦，别熬太晚'; }
    document.getElementById('greetWord').textContent = g;
    document.getElementById('greetSub').textContent = sub;
  }
  updateClock();
  setInterval(updateClock, 20000);

  /* ============ 搜索 ============ */
  const enginesEl = document.getElementById('engines');
  let currentEngine = ENGINES[0];
  enginesEl.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      enginesEl.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentEngine = ENGINES[+b.dataset.i];
    };
  });

  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = searchInput.value.trim();
      if (!q) return;
      if (/^https?:\/\//i.test(q)) { window.open(q, '_blank'); return; }
      if (/^[\w-]+(\.[\w-]+)+.*$/.test(q) && !q.includes(' ')) {
        window.open('https://' + q, '_blank'); return;
      }
      window.open(currentEngine.url + encodeURIComponent(q), '_blank');
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
    if (e.key === 'Escape') searchInput.blur();
  });

  /* ============ 主题 ============ */
  const themeBtn = document.getElementById('themeToggle');
  const themeIcon = themeBtn.querySelector('i');
  const saved = localStorage.getItem('harbor-theme') || 'light';
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeIcon.className = 'lucide lucide-sun';
  }
  themeBtn.onclick = () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('harbor-theme', 'light');
      themeIcon.className = 'lucide lucide-moon';
      toast('已切换至浅色模式');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('harbor-theme', 'dark');
      themeIcon.className = 'lucide lucide-sun';
      toast('已切换至深色模式');
    }
  };

  /* ============ Toast ============ */
  const toastEl = document.getElementById('toast');
  let toastT;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
